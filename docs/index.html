<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Neovim Savitsky Museum Theme Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #0f0f14;
      --panel: #181825;
      --text: #cdd6f4;
      --muted: #a6adc8;
      --border: #313244;
    }

    body {
      margin: 0;
      padding: 2rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 2rem;
      font-size: 2rem;
    }

    .theme {
      margin-bottom: 3rem;
      padding: 1.5rem;
      background: var(--panel);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .theme h2 {
      margin: 0 0 1rem 0;
      font-size: 1.4rem;
    }

    /* 3-column layout: artwork | palettes | demo */
    .theme-content {
      display: grid;
      grid-template-columns: 220px 1fr 360px;
      gap: 1.5rem;
      align-items: start;
    }

    .theme-media,
    .theme-demo {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* Hover zoom container (keeps border radius + prevents layout shift) */
    .zoom {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0003;
    }

    .zoom img {
      width: 100%;
      display: block;
      transform: scale(1);
      transition: transform 180ms ease, filter 180ms ease;
      will-change: transform;
    }

    .zoom:hover img {
      transform: scale(1.9);
      filter: saturate(1.05) contrast(1.05);
      cursor: zoom-in;
    }

    /* Optional: focus-visible support for keyboard users */
    .zoom:focus-within img {
      transform: scale(1.9);
      filter: saturate(1.05) contrast(1.05);
    }

    .theme-palettes {
      min-width: 0;
    }

    .section {
      margin-top: 1.25rem;
    }

    .section:first-child {
      margin-top: 0;
    }

    .section h3 {
      margin: 0 0 0.75rem 0;
      font-size: 1rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .swatch {
      width: 72px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .swatch-box {
      width: 100%;
      height: 48px;
      border-radius: 8px;
      border: 1px solid #0006;
      margin-bottom: 0.3rem;
    }

    .hex {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.7rem;
      color: var(--muted);
    }

    footer {
      margin-top: 4rem;
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* Mobile fallback */
    @media (max-width: 900px) {
      body {
        padding: 1.25rem;
      }

      .theme-content {
        grid-template-columns: 1fr;
      }

      .theme {
        padding: 1.25rem;
      }

      .zoom:hover img,
      .zoom:focus-within img {
        transform: scale(1.25);
      }
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .zoom img {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <h1>Neovim Savitsky Museum Theme Gallery</h1>

  <div id="gallery">Loading…</div>

  <footer>
    Auto-generated from Lua themes.
  </footer>

  <script>
    async function loadThemes() {
      const res = await fetch("themes.json");
      return await res.json();
    }

    function makeSwatch(hex, label = "") {
      const wrap = document.createElement("div");
      wrap.className = "swatch";

      const box = document.createElement("div");
      box.className = "swatch-box";
      box.style.background = hex;

      const hexLabel = document.createElement("div");
      hexLabel.className = "hex";
      hexLabel.textContent = hex;

      wrap.appendChild(box);
      if (label) {
        const name = document.createElement("div");
        name.textContent = label;
        wrap.appendChild(name);
      }
      wrap.appendChild(hexLabel);

      return wrap;
    }

    function makeZoomImage(src, alt, onMissingRemoveEl) {
      const wrap = document.createElement("div");
      wrap.className = "zoom";

      const img = document.createElement("img");
      img.src = src;
      img.alt = alt;
      img.loading = "lazy";
      img.onerror = () => onMissingRemoveEl?.remove();

      wrap.appendChild(img);
      return wrap;
    }

    function renderTheme(name, theme) {
      const container = document.createElement("div");
      container.className = "theme";

      const title = document.createElement("h2");
      title.textContent = name;
      container.appendChild(title);

      const content = document.createElement("div");
      content.className = "theme-content";

      /* Left: artwork (photos/) */
      const media = document.createElement("div");
      media.className = "theme-media";

      const art = makeZoomImage(`photos/${name}.png`, `${name} source image`, media);
      media.appendChild(art);
      content.appendChild(media);

      /* Center: palettes */
      const palettes = document.createElement("div");
      palettes.className = "theme-palettes";

      if (theme.core && Object.keys(theme.core).length) {
        const section = document.createElement("div");
        section.className = "section";

        const h = document.createElement("h3");
        h.textContent = "Core UI";
        section.appendChild(h);

        const row = document.createElement("div");
        row.className = "swatches";

        for (const [k, hex] of Object.entries(theme.core)) {
          row.appendChild(makeSwatch(hex, k));
        }

        section.appendChild(row);
        palettes.appendChild(section);
      }

      if (theme.accents && Object.keys(theme.accents).length) {
        const section = document.createElement("div");
        section.className = "section";

        const h = document.createElement("h3");
        h.textContent = "Accents";
        section.appendChild(h);

        const row = document.createElement("div");
        row.className = "swatches";

        for (const [group, colors] of Object.entries(theme.accents)) {
          for (const hex of colors) {
            row.appendChild(makeSwatch(hex, group));
          }
        }

        section.appendChild(row);
        palettes.appendChild(section);
      }

      content.appendChild(palettes);

      /* Right: Neovim demo screenshot (demo/) */
      const demoWrap = document.createElement("div");
      demoWrap.className = "theme-demo";

      const demo = makeZoomImage(`demo/${name}.png`, `${name} Neovim screenshot`, demoWrap);
      demoWrap.appendChild(demo);
      content.appendChild(demoWrap);

      container.appendChild(content);
      return container;
    }

    async function main() {
      const gallery = document.getElementById("gallery");
      gallery.textContent = "";

      const themes = await loadThemes();

      for (const [name, theme] of Object.entries(themes)) {
        gallery.appendChild(renderTheme(name, theme));
      }
    }

    main();
  </script>

</body>
</html>
